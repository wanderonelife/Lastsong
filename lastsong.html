<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ラストソング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night1:#120a24; --night2:#2a0f3d; --neon:#ff5fa8; --neon2:#b98cff; --gold:#ffd77a;
  --ink:#fdf3fb; --dim:#c9b6d8;
  --dawn1:#ffd6a5; --dawn2:#ff9fb0; --dawn3:#8fb8ff;
  --serif:"Shippori Mincho","Noto Serif TC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night1);color:var(--ink);font-family:"Zen Maru Gothic","Noto Sans TC",system-ui,sans-serif;overflow:hidden}
body.zh{font-family:"Noto Sans TC","Zen Maru Gothic",system-ui,sans-serif}
body.zh{--serif:"Noto Serif TC","Shippori Mincho",serif}
#sky{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 0%,var(--night2),var(--night1));transition:opacity 4s ease}
#dawn{position:fixed;inset:0;background:linear-gradient(180deg,var(--dawn3) 0%,var(--dawn2) 55%,var(--dawn1) 100%);opacity:0;transition:opacity 5s ease}
#sparkles{position:fixed;inset:0;pointer-events:none;transition:opacity 4s}
.spk{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.6;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 58px) 20px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column}
.scene{display:none;flex:1;flex-direction:column;animation:fade .9s ease;min-height:0}
.scene.on{display:flex}
.scroll{flex:1;overflow-y:auto;min-height:0;margin:8px -4px;padding:0 4px}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-family:var(--serif);font-size:44px;margin:0;letter-spacing:.12em;text-align:center;color:#fff;text-shadow:0 0 12px var(--neon),0 0 32px var(--neon)}
h2{font-family:var(--serif);font-size:22px;margin:4px 0 6px;letter-spacing:.08em}
h3{font-size:14px;margin:16px 0 4px;color:var(--neon2);font-weight:700}
.chap{font-size:12px;letter-spacing:.3em;color:var(--neon2)}
p{line-height:1.9;margin:.4em 0}
body{line-break:strict}
.punch,.lead,.mem,.wishline,#hit,#bossSay,.bcard{text-wrap:balance;word-break:auto-phrase}
.lead{color:var(--dim);font-size:14px}
.center{text-align:center}
.grow{flex:1}
.mincho{font-family:var(--serif)}
.btn{display:block;width:100%;border:none;border-radius:999px;padding:16px;font:inherit;font-size:16px;font-weight:700;color:#2a0f3d;background:linear-gradient(90deg,var(--gold),#ffb3d6);box-shadow:0 6px 24px rgba(255,95,168,.35);cursor:pointer;transition:transform .15s;margin-top:10px}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.35);box-shadow:none;font-weight:500}
.btn.small{padding:10px;font-size:14px}
.btn[disabled]{opacity:.35;pointer-events:none}
input.name,textarea{width:100%;padding:14px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:16px;outline:none}
input.name{text-align:center}
textarea{min-height:170px;resize:none;line-height:1.8;font-family:var(--serif)}
::placeholder{color:#9c88ad}
.neonsign{font-family:var(--serif);text-align:center;font-size:15px;letter-spacing:.4em;color:var(--neon);text-shadow:0 0 8px var(--neon);margin:14px 0 4px;animation:flick 4s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.4}95%{opacity:1}97%{opacity:.6}}
.punch{font-family:var(--serif);font-size:18px;line-height:1.9;text-align:center;margin:18px 0;animation:fade 1s ease}

details.memo{margin-top:8px;background:rgba(185,140,255,.12);border:1px solid rgba(185,140,255,.3);border-radius:14px;padding:8px 12px;font-size:13px;line-height:1.8}
details.memo summary{cursor:pointer;color:var(--neon2);font-weight:700;list-style:none}
details.memo summary::-webkit-details-marker{display:none}
.dawnink details.memo{background:rgba(255,255,255,.45);border-color:rgba(255,255,255,.7);color:#3a2140}
.dawnink details.memo summary{color:#a0507a}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3);font-size:14px;cursor:pointer;transition:all .2s;user-select:none}
.chip.sel{background:#fff;color:#3a2140;box-shadow:0 4px 14px rgba(255,120,150,.4);font-weight:700}
.dawnink .chip{background:rgba(255,255,255,.5);color:#3a2140;border-color:rgba(255,255,255,.8)}
.dawnink .chip.sel{background:#fff}

.meter{margin:14px 0}
input[type=range]{width:100%;accent-color:var(--neon)}
.mval{font-size:40px;text-align:center;font-family:var(--serif)}
.mlab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}

#field{position:relative;flex:1;margin:10px 0;min-height:300px}
.bub{position:absolute;width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55),rgba(255,140,200,.25) 45%,rgba(185,140,255,.15) 70%);
  border:1px solid rgba(255,255,255,.35);box-shadow:0 0 18px rgba(255,95,168,.35);animation:float 6s infinite ease-in-out;transition:transform .5s,opacity .5s}
.bub.done{transform:scale(0);opacity:0;pointer-events:none}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -14px}}
#jar{display:flex;align-items:center;justify-content:center;gap:4px;min-height:30px;font-size:20px;color:var(--gold);text-shadow:0 0 10px var(--gold)}
.star{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.5)}100%{transform:scale(1)}}

.modal{position:fixed;inset:0;background:rgba(10,4,20,.65);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.on{display:flex}
.card{width:100%;max-width:420px;max-height:86vh;overflow-y:auto;background:linear-gradient(160deg,#3a1650,#1d0c30);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:24px 20px;text-align:center;animation:fade .4s ease;box-shadow:0 20px 60px rgba(0,0,0,.5);color:var(--ink)}
.card .emo{font-size:46px}
.card .mem{font-family:var(--serif);font-size:19px;line-height:1.8;margin:10px 0 6px}
.card .sub{color:var(--dim);font-size:14px;margin-bottom:8px}

.rc{background:#fffaf2;color:#3a2a33;border-radius:6px;padding:12px 14px;font-size:14px;cursor:pointer;transition:transform .8s ease,opacity .8s ease;margin-bottom:10px;
  mask:radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) 0 0/14px 100% repeat-x}
.rc .row{display:flex;justify-content:space-between;font-family:ui-monospace,monospace}
.rc .re{display:none;font-family:var(--serif);font-size:15px;line-height:1.7;color:#7a2d55}
.rc.flip .row{display:none}.rc.flip .re{display:block}
.rc.fly{transform:translate(120%,-60px) rotate(25deg);opacity:0}
.rc .hint{font-size:11px;color:#a98;margin-top:4px}

.wc{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .6s}
.wc.on{background:linear-gradient(120deg,#ffe3ef,#fff4d6);color:#3a2140}

#letterFly{font-family:var(--serif);white-space:pre-wrap;line-height:1.8;transition:all 3s ease;padding:10px}
#letterFly.gone{transform:translateY(-200px) scale(.4);opacity:0;filter:blur(6px)}

.closing{margin:16px auto 6px;max-width:300px;background:#fffaf2;color:#3a2a33;border-radius:10px;padding:18px 16px;text-align:center;font-family:var(--serif);font-size:15px;line-height:1.7;box-shadow:0 0 0 3px #3a2a33 inset,0 0 0 6px #fffaf2 inset,0 0 30px rgba(255,95,168,.4);animation:fade 1s ease}
.msg{background:rgba(255,255,255,.1);border-radius:18px 18px 18px 4px;padding:14px 16px;margin:8px 0;line-height:1.8;max-width:88%}
.msg .who{font-size:12px;color:var(--neon2);margin-bottom:2px}
.mine{align-self:flex-end;background:linear-gradient(90deg,#ff7fb8,#c69bff);color:#2a0f3d;border-radius:18px 18px 4px 18px}
.lights{display:flex;justify-content:center;gap:14px;margin:18px 0}
.lt{width:16px;height:16px;border-radius:50%;background:var(--neon);box-shadow:0 0 14px var(--neon),0 0 30px var(--neon);transition:all .6s}
.lt:nth-child(even){background:var(--neon2);box-shadow:0 0 14px var(--neon2),0 0 30px var(--neon2)}
.lt.off{background:#3b2d48;box-shadow:none}
#holdBtn{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#holdFill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.55)}
#holdBtn span{position:relative}
#holdText{min-height:60px;font-family:var(--serif);font-size:19px;text-align:center;line-height:1.7}

.dawnink{color:#3a2140}
.dawnink .lead{color:#6b4a6b}
.dawnink h3{color:#a0507a}
.dawnink .mlab{color:#6b4a6b}
.dawnink input.name,.dawnink textarea{background:rgba(255,255,255,.6);color:#3a2140;border-color:rgba(255,255,255,.9)}
.dawnink ::placeholder{color:#a58aa0}
.endcard{background:rgba(255,255,255,.75);border-radius:24px;padding:22px 18px;color:#3a2140;text-align:center;box-shadow:0 10px 40px rgba(255,120,150,.3)}
.endcard .big{font-family:var(--serif);font-size:22px;margin:6px 0 8px}
.endcard .sec{font-size:13px;margin-top:14px;color:#a0507a;letter-spacing:.1em}
.endcard ul{list-style:none;padding:0;margin:6px 0;text-align:left;font-size:14px}
.endcard li{padding:5px 0;border-bottom:1px dashed #e7c3cf}
.sun{width:110px;height:110px;border-radius:50%;margin:0 auto;background:radial-gradient(circle,#fff7d6,#ffd27a 60%,rgba(255,210,122,0) 72%);animation:rise 4s ease forwards}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.dawn-on .btn{background:linear-gradient(90deg,#ff9fb0,#ffc58a);color:#3a2140}
.dawn-on .btn.ghost{color:#3a2140;border-color:rgba(58,33,64,.3);background:transparent}

/* top bar */
#topbar{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:12px;z-index:15;display:flex;gap:8px}
.topb{border:1px solid rgba(255,255,255,.4);background:rgba(30,12,50,.6);color:#fff;border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;backdrop-filter:blur(4px);cursor:pointer}
#omaBtn{display:none}

/* omamori */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.tab{flex:0 0 auto;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.3);font-size:13px;cursor:pointer}
.tab.on{background:#fff;color:#3a2140;font-weight:700}
.tpane{text-align:left;font-size:14px;line-height:1.8;max-height:60vh;overflow-y:auto}
.breath{width:150px;height:150px;border-radius:50%;margin:16px auto;background:radial-gradient(circle,#ffd3ea,#b98cff);transform:scale(.55);display:flex;align-items:center;justify-content:center;color:#2a0f3d;font-weight:700}
.wave{height:90px;position:relative;overflow:hidden;border-radius:14px;background:rgba(255,255,255,.06);margin:10px 0}
.wave svg{position:absolute;left:0;bottom:0;width:200%;animation:wv 4s linear infinite}
@keyframes wv{to{transform:translateX(-50%)}}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.15);cursor:pointer}
.chk .bx{flex:0 0 22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center}
.chk.on .bx{background:var(--neon);border-color:var(--neon)}
.note{font-size:12px;color:var(--dim);margin-top:12px}
.dawnink .note{color:#6b4a6b}

/* garden */
.ghead{display:flex;justify-content:space-between;align-items:baseline}
.gday{font-family:var(--serif);font-size:28px}
.prog{height:8px;border-radius:99px;background:rgba(255,255,255,.5);overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ff9fb0,#ffc58a);border-radius:99px;transition:width 1s}
.bed{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(160,110,80,.25));margin:8px 0}
.plant{aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;cursor:pointer;position:relative;font-size:26px;transition:transform .3s}
.plant small{font-size:10px;color:#6b4a6b;margin-top:2px}
.plant.s4{font-size:36px}
.plant.s4::after{content:"✨";position:absolute;top:2px;right:4px;font-size:12px}
.plant.grow{animation:pgrow 1.2s ease}
@keyframes pgrow{0%{transform:scale(1)}40%{transform:scale(1.25) translateY(-6px)}100%{transform:scale(1)}}
.gbox{background:rgba(255,255,255,.6);border-radius:18px;padding:14px 16px;margin:10px 0}
.gbox h4{margin:0 0 4px;font-size:13px;color:#a0507a;letter-spacing:.05em}
.wishline{font-family:var(--serif);font-size:16px;line-height:1.8}
.task{font-size:15px;line-height:1.8}
.why{font-size:12px;color:#6b4a6b;margin-top:4px}
.seg{display:flex;gap:8px;margin-top:8px}
.seg .chip{flex:1;text-align:center}
.drop{position:fixed;font-size:26px;pointer-events:none;animation:drop 1s ease-in forwards;z-index:30}
.addrow{display:flex;gap:8px;margin:6px 0}
.addrow input.name{text-align:left;font-size:14px;padding:12px 14px}
.addb{flex:0 0 50px;border:none;border-radius:14px;background:linear-gradient(90deg,var(--gold),#ffb3d6);font-size:24px;font-weight:700;color:#2a0f3d;cursor:pointer}
.fl{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 14px;margin:6px 0;font-family:var(--serif);line-height:1.6;animation:fade .5s ease}
.fl b{flex:0 0 auto;opacity:.6;cursor:pointer;font-weight:400}
#cut{position:fixed;inset:0;z-index:45;background:radial-gradient(120% 90% at 50% 20%,#1d0b33,#05010b);display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px 26px;cursor:pointer;overflow:hidden}
#cut.on{display:flex}
#cut.dawnbg{background:linear-gradient(180deg,#8fb8ff,#ff9fb0 60%,#ffd6a5)}
#cut.dawnbg #cutText{color:#3a2140;text-shadow:0 0 12px rgba(255,255,255,.8)}
.cutInner{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:420px;width:100%}
#cutText{width:100%;white-space:nowrap;font-family:var(--serif);font-size:21px;line-height:2;text-align:center;color:#fff;min-height:120px;text-shadow:0 0 12px rgba(255,95,168,.5)}
#cutText.big{font-size:28px;color:#fff;text-shadow:0 0 14px var(--neon),0 0 34px var(--neon)}
#cutText.huge{font-size:40px;letter-spacing:.08em;color:#fff;text-shadow:0 0 14px var(--neon),0 0 40px var(--neon),0 0 80px var(--neon)}
#cutTap{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 26px);font-size:12px;letter-spacing:.3em;color:rgba(255,255,255,.6);animation:tw 1.6s infinite}
#cut.dawnbg #cutTap{color:rgba(58,33,64,.6)}
#cutSkip{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px;font-size:11px;opacity:.7}
#cutFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#cutFlash.go{animation:flash 1.1s ease}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(5px,5px)}}
#rain{position:absolute;inset:0;display:none;pointer-events:none}
.rd{position:absolute;top:-20%;width:1px;height:70px;background:linear-gradient(transparent,rgba(190,200,255,.55));animation:rainf linear infinite}
@keyframes rainf{to{transform:translateY(130vh)}}
#credits{position:fixed;inset:0;z-index:46;background:#05010b;display:none;overflow:hidden;cursor:pointer}
#credits.on{display:block}
#credRoll{position:absolute;left:0;right:0;top:100%;text-align:center;color:#fff;font-family:var(--serif);animation:roll 30s linear forwards;padding:0 24px}
@keyframes roll{to{transform:translateY(calc(-100% - 100vh))}}
#credRoll .role{font-size:12px;letter-spacing:.3em;color:var(--neon2);margin-top:34px}
#credRoll .who{font-size:22px;margin-top:6px;text-shadow:0 0 12px rgba(255,95,168,.6)}
/* battle */
.hpbar{height:12px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);overflow:hidden;margin:6px 10px}
.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5fa8,#b98cff);transition:width .8s ease}
#bossArea{position:relative;display:flex;flex-direction:column;align-items:center;min-height:230px}
#boss{animation:wob 3s ease-in-out infinite;filter:drop-shadow(0 0 22px rgba(185,140,255,.6));transition:opacity 2s,transform 2s}
@keyframes wob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.03,0.98)}}
#boss.hurt{animation:hurt .6s ease}
@keyframes hurt{0%,100%{filter:drop-shadow(0 0 22px rgba(185,140,255,.6))}30%{filter:brightness(3) drop-shadow(0 0 30px #fff);transform:translateX(10px) rotate(4deg)}60%{transform:translateX(-8px) rotate(-3deg)}}
#boss.die{opacity:0;transform:scale(1.8) translateY(-40px);filter:brightness(4) blur(6px)}
#bossSay{background:rgba(20,8,36,.85);border:1px solid rgba(255,95,168,.5);border-radius:16px;padding:10px 14px;font-family:var(--serif);font-size:15px;line-height:1.6;min-height:46px;max-width:92%;text-align:center;margin-bottom:6px}
#dmg{position:absolute;top:70px;font-size:34px;font-weight:700;color:var(--gold);text-shadow:0 0 12px #ff5fa8;opacity:0;pointer-events:none}
#dmg.go{animation:dmgup 1.2s ease}
@keyframes dmgup{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:translateY(-50px)}}
#hit{position:absolute;top:40%;left:0;right:0;text-align:center;font-family:var(--serif);font-size:22px;font-weight:700;color:#fff;text-shadow:0 0 12px var(--neon),0 0 30px var(--neon);opacity:0;pointer-events:none;padding:0 10px}
#hit.go{animation:hitzoom 1.3s ease}
@keyframes hitzoom{0%{opacity:0;transform:scale(.3) translateY(120px)}25%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}
#cards{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bcard{background:linear-gradient(120deg,rgba(255,215,122,.18),rgba(255,95,168,.18));border:1px solid rgba(255,215,122,.6);border-radius:16px;padding:12px 14px;font-family:var(--serif);font-size:15px;line-height:1.5;cursor:pointer;text-align:left;color:#fff;transition:transform .15s}
.bcard:active{transform:scale(.97)}
.bcard small{display:block;font-family:inherit;font-size:11px;color:var(--gold);margin-bottom:2px;letter-spacing:.1em}
#special{font-size:18px;animation:pulse 1.2s infinite;background:linear-gradient(90deg,#ffd77a,#ff5fa8,#b98cff);color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,95,168,.7)}50%{box-shadow:0 0 0 14px rgba(255,95,168,0)}}
#dm{position:fixed;inset:0;z-index:40;background:rgba(14,5,26,.72);backdrop-filter:blur(3px);display:none;overflow:hidden}
#dm.on{display:block}
.dmi{position:absolute;left:100%;white-space:nowrap;font-family:var(--serif);font-weight:700;animation:dmfly linear forwards;pointer-events:none}
@keyframes dmfly{to{transform:translateX(calc(-100vw - 100% - 40px))}}
#dmEnd{position:absolute;left:0;right:0;top:42%;text-align:center;font-family:var(--serif);font-size:26px;color:#fff;text-shadow:0 0 18px var(--neon);opacity:0;transition:opacity 2s;padding:0 20px;line-height:1.7}
#dmClose{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 30px);padding:10px 28px;font-size:15px}
.her{image-rendering:auto;filter:drop-shadow(0 6px 10px rgba(80,30,80,.25));animation:fade 1.2s ease}
.bob{animation:bob 3.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.her.glow{animation:glow 1.6s ease}
@keyframes glow{0%{filter:brightness(2.2) drop-shadow(0 0 30px #fff)}100%{filter:drop-shadow(0 6px 10px rgba(80,30,80,.25))}}
@keyframes drop{from{transform:translateY(-120px);opacity:0}30%{opacity:1}to{transform:translateY(0);opacity:0}}
</style>
</head>
<body>
<div id="sky"></div><div id="dawn"></div><div id="sparkles"></div>
<div id="topbar">
  <button class="topb" id="friendBtn" onclick="playDanmaku()" style="display:none">💬</button>
  <button class="topb" id="langBtn" onclick="toggleLang()">中文</button>
  <button class="topb" id="omaBtn" onclick="openOma()" data-i="oma"></button>
</div>

<div id="app">

  <!-- 0 TITLE -->
  <section class="scene on" id="s0">
    <div class="grow"></div>
    <div class="neonsign">CLUB ◇ MEMORIES</div>
    <h1 data-i="title"></h1>
    <p class="center lead" style="margin-top:14px" data-i="title_sub"></p>
    <p class="center mincho" style="margin:4px 0 0;color:var(--gold);text-shadow:0 0 10px rgba(255,215,122,.6);font-size:15px" data-i="revenge_tag"></p>
    <div class="grow"></div>
    <div style="display:flex;align-items:center;gap:10px;justify-content:center">
      <img class="her" id="herTitle" style="height:170px">
      <p class="mincho" style="font-size:14px;line-height:1.9;margin:0" data-i="concept"></p>
    </div>
    <div class="grow"></div>
    <p class="center lead" data-i="name_label"></p>
    <input class="name" id="nameIn" maxlength="12" data-ph="name_ph">
    <button class="btn" onclick="startStory()" data-i="enter"></button>
    <button class="btn ghost" id="toGarden" style="display:none" onclick="openGarden()"></button>
  </section>

  <!-- 1 FEELINGS -->
  <section class="scene" id="s1">
    <div class="chap">CHAPTER 1</div>
    <h2 data-i="c1_t"></h2>
    <div class="scroll">
      <p class="lead" data-i="c1_lead"></p>
      <div class="chips" id="feels"></div>
      <div class="meter">
        <p class="lead" data-i="pain_q"></p>
        <div class="mval" id="m1v">5</div>
        <input type="range" min="0" max="10" value="5" id="m1" oninput="$('m1v').textContent=this.value">
        <div class="mlab"><span data-i="pain_lo"></span><span data-i="pain_hi"></span></div>
      </div>
      <div id="feelOut"></div>
      <details class="memo"><summary data-i="memo1_s"></summary><span data-i="memo1"></span></details>
    </div>
    <button class="btn" id="next1" onclick="feelDone()" disabled data-i="next1"></button>
  </section>

  <!-- 2 MEMORIES -->
  <section class="scene" id="s2">
    <div class="chap">CHAPTER 2</div>
    <h2 data-i="c2_t"></h2>
    <p class="lead" data-i="c2_lead"></p>
    <div id="field"></div>
    <div id="jar"></div>
    <details class="memo"><summary data-i="memo2_s"></summary><span data-i="memo2"></span></details>
    <button class="btn" id="next2" onclick="go(3)" disabled data-i="next"></button>
  </section>

  <!-- 3 RECEIPTS -->
  <section class="scene" id="s3">
    <div class="chap">CHAPTER 3</div>
    <h2 data-i="c3_t"></h2>
    <p class="lead" data-i="c3_lead"></p>
    <div class="scroll" id="receipts"></div>
    <details class="memo"><summary data-i="memo3_s"></summary><span data-i="memo3"></span></details>
    <button class="btn" id="next3" onclick="playCut('a',()=>go(4))" disabled data-i="next"></button>
  </section>

  <!-- 4 DISLIKES -> WISHES -->
  <section class="scene" id="s4">
    <div class="chap">CHAPTER 4</div>
    <h2 data-i="c4_t"></h2>
    <div id="wishA" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <p class="lead" data-i="c4_lead"></p>
      <div class="scroll"><div class="chips" id="dislikes"></div></div>
      <input class="name" id="ownDis" maxlength="30" data-ph="own_ph" style="font-size:14px">
      <button class="btn" id="disBtn" onclick="toWishes()" disabled data-i="dis_btn"></button>
    </div>
    <div id="wishB" style="display:none;flex-direction:column;flex:1;min-height:0">
      <p class="lead" data-i="c4_lead2"></p>
      <div class="scroll" id="wishes"></div>
      <details class="memo"><summary data-i="memo4_s"></summary><span data-i="memo4"></span></details>
      <button class="btn" id="next4" onclick="go(5)" disabled data-i="next"></button>
    </div>
  </section>

  <!-- 5 LETTER -->
  <section class="scene" id="s5">
    <div class="chap">CHAPTER 5</div>
    <h2 data-i="c5_t"></h2>
    <div id="letA" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <p class="lead" data-i="c5_lead"></p>
      <div class="chips" id="prompts"></div>
      <textarea id="letter" data-ph="letter_ph"></textarea>
      <details class="memo"><summary data-i="memo5_s"></summary><span data-i="memo5"></span></details>
      <button class="btn" onclick="sendLetter()" data-i="send"></button>
      <button class="btn ghost small" onclick="go(6)" data-i="skip"></button>
    </div>
    <div id="letB" style="display:none;flex-direction:column;flex:1;min-height:0">
      <div class="scroll"><div id="letterFly"></div></div>
      <div id="letMsg"></div>
      <button class="btn" id="next5" onclick="go(6)" style="display:none" data-i="next"></button>
    </div>
  </section>

  <!-- 6 LAST NIGHT -->
  <section class="scene" id="s6">
    <div class="chap">CHAPTER 6</div>
    <h2 data-i="c6_t"></h2>
    <p class="lead" data-i="c6_lead"></p>
    <div class="scroll">
      <div id="chat" style="display:flex;flex-direction:column"></div>
      <div id="opts"></div>
      <div id="holdArea" style="display:none">
        <div class="lights" id="lights"></div>
        <div id="holdText"></div>
        <details class="memo"><summary data-i="memo6_s"></summary><span data-i="memo6"></span></details>
      </div>
    </div>
    <button class="btn" id="holdBtn" style="display:none"><div id="holdFill"></div><span data-i="hold_btn"></span></button>
  </section>

  <!-- 7 BACK TO ME -->
  <section class="scene" id="s7">
    <div class="chap">CHAPTER 7</div>
    <h2 data-i="c7_t"></h2>
    <div class="scroll">
      <p class="lead" data-i="c7_lead"></p>
      <h3 data-i="self_h"></h3>
      <div class="chips" id="selfChips"></div>
      <h3 data-i="chal_h"></h3>
      <div class="addrow"><input class="name" id="chalIn" maxlength="30" data-ph="chal_ph"><button class="addb" onclick="addCustom('chal')">＋</button></div>
      <div class="chips" id="chalChips"></div>
      <h3 data-i="look_h"></h3>
      <div class="addrow"><input class="name" id="lookIn" maxlength="30" data-ph="look_ph"><button class="addb" onclick="addCustom('look')">＋</button></div>
      <div class="chips" id="lookChips"></div>
      <h3 data-i="learn_h"></h3>
      <div class="chips" id="learnChips"></div>
      <details class="memo"><summary data-i="memo7_s"></summary><span data-i="memo7"></span></details>
    </div>
    <button class="btn" id="next7" onclick="playCut('c',()=>go(12))" disabled data-i="next7"></button>
  </section>

  <!-- 13 BOSS BATTLE -->
  <section class="scene" id="s13">
    <div class="chap" style="color:#ff5fa8;text-align:center">FINAL BATTLE</div>
    <h2 class="center" data-i="b_title" style="margin:2px 0"></h2>
    <div class="hpbar"><i id="bossHp"></i></div>
    <div id="bossArea">
      <div id="bossSay"></div>
      <svg id="boss" viewBox="0 0 200 200" width="170" height="170">
        <defs><radialGradient id="bg1" cx="50%" cy="45%" r="55%"><stop offset="0%" stop-color="#5b2a7a"/><stop offset="70%" stop-color="#2a0f3d"/><stop offset="100%" stop-color="#120a24" stop-opacity="0"/></radialGradient></defs>
        <path d="M100 18 C150 18 178 60 176 108 C174 150 160 186 140 172 C128 190 112 176 100 190 C88 176 72 190 60 172 C40 186 26 150 24 108 C22 60 50 18 100 18Z" fill="url(#bg1)" stroke="#b98cff" stroke-opacity=".5" stroke-width="2"/>
        <ellipse cx="74" cy="92" rx="11" ry="15" fill="#ff5fa8"/><ellipse cx="126" cy="92" rx="11" ry="15" fill="#ff5fa8"/>
        <ellipse cx="74" cy="90" rx="4" ry="6" fill="#fff"/><ellipse cx="126" cy="90" rx="4" ry="6" fill="#fff"/>
        <path d="M78 132 Q100 118 122 132" stroke="#ff5fa8" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
      <div id="dmg"></div>
      <div id="hit"></div>
    </div>
    <div style="display:flex;align-items:flex-end;gap:10px;margin-top:4px">
      <img class="her" id="herBattle" style="height:120px">
      <p class="lead" style="margin:0 0 6px" id="bPrompt" data-i="b_choose"></p>
    </div>
    <div id="cards"></div>
    <button class="btn" id="special" style="display:none" onclick="specialAtk()" data-i="b_special"></button>
  </section>

  <!-- 12 BEST FRIEND -->
  <section class="scene" id="s12">
    <div class="chap">CHAPTER 8</div>
    <h2 data-i="c12_t"></h2>
    <div class="scroll">
      <p class="lead" data-i="c12_lead"></p>
      <div class="addrow"><input class="name" id="friendIn" maxlength="40" data-ph="friend_ph"><button class="addb" onclick="addFriend()">＋</button></div>
      <p class="lead" style="font-size:12px;margin:8px 0 0" data-i="friend_hint"></p>
      <div class="chips" id="friendSug"></div>
      <h3 id="friendCount"></h3>
      <div id="friendList"></div>
      <details class="memo"><summary data-i="memo12_s"></summary><span data-i="memo12"></span></details>
    </div>
    <button class="btn ghost small" onclick="playDanmaku()" data-i="friend_play"></button>
    <button class="btn" id="next12" onclick="playCut('d',()=>go(13))" disabled data-i="next"></button>
  </section>

  <!-- 8 DAWN -->
  <section class="scene dawnink" id="s8">
    <div class="chap" style="color:#a0507a">CHAPTER 9</div>
    <h2 data-i="c8_t"></h2>
    <div class="scroll">
      <div style="position:relative;text-align:center"><div class="sun" style="position:absolute;left:50%;margin-left:-55px;top:0"></div><img class="her" id="herDawn" style="height:190px;position:relative"></div>
      <p class="lead center" data-i="c8_lead"></p>
      <h3 data-i="acts_h"></h3>
      <div class="chips" id="chips"></div>
      <div class="addrow"><input class="name" id="actsCIn" maxlength="30" data-ph="acts_ph"><button class="addb" onclick="addCustom('actsC')">＋</button></div>
      <div class="chips" id="actsCChips"></div>
      <h3 data-i="people_h"></h3>
      <div class="chips" id="people"></div>
      <details class="memo"><summary data-i="memo8_s"></summary><span data-i="memo8"></span></details>
    </div>
    <button class="btn" id="next8" onclick="go(9)" disabled data-i="next8"></button>
  </section>

  <!-- 9 FEELINGS AFTER -->
  <section class="scene dawnink" id="s9">
    <div class="chap" style="color:#a0507a">LAST</div>
    <h2 data-i="c9_t"></h2>
    <div class="grow"></div>
    <p class="lead center" data-i="pain_q"></p>
    <div class="mval" id="m2v">5</div>
    <input type="range" min="0" max="10" value="5" id="m2" oninput="$('m2v').textContent=this.value">
    <div class="mlab"><span data-i="pain_lo"></span><span data-i="pain_hi"></span></div>
    <div class="grow"></div>
    <button class="btn" onclick="ending()" data-i="result"></button>
  </section>

  <!-- 10 END -->
  <section class="scene dawnink" id="s10">
    <div class="scroll"><div class="endcard" id="endcard"></div></div>
    <button class="btn" id="gardenStart" onclick="startGarden()"></button>
    <button class="btn ghost small" onclick="playDanmaku()" data-i="friend_listen"></button>
    <button class="btn ghost small" onclick="openOma()" data-i="open_oma"></button>
    <button class="btn ghost small" onclick="location.reload()" data-i="restart"></button>
  </section>

  <!-- 11 GARDEN -->
  <section class="scene dawnink" id="s11">
    <div class="ghead"><h2 data-i="g_title" style="margin:0"></h2><div class="gday" id="gDay"></div></div>
    <div class="prog"><i id="gProg"></i></div>
    <div class="scroll" id="gScroll">
      <div class="center" style="margin:4px 0 6px">
        <img class="her bob" id="herGarden" style="height:200px">
        <div class="mincho" id="herStage" style="font-size:15px;color:#a0507a"></div>
        <div class="why" id="herNext"></div>
      </div>
      <p class="lead" data-i="g_lead"></p>
      <div class="bed" id="bed"></div>
      <p class="lead center" style="font-size:12px;margin:0" data-i="g_tap"></p>
      <div id="gToday"></div>
      <button class="btn" onclick="playDanmaku()" data-i="friend_listen"></button>
      <div class="gbox">
        <h4 data-i="g_graph"></h4>
        <div id="graph"></div>
      </div>
      <p class="note center" data-i="g_note"></p>
      <button class="btn ghost small" onclick="location.reload()" data-i="g_back"></button>
      <button class="btn ghost small" id="resetBtn" onclick="askReset()" data-i="g_reset"></button>
    </div>
  </section>

</div>

<!-- memory / info modal -->
<div class="modal" id="modal"><div class="card">
  <div class="emo" id="mEmo"></div>
  <div class="mem" id="mMem"></div>
  <div class="sub" id="mSub"></div>
  <button class="btn" id="mBtn"></button>
</div></div>

<!-- cutscene overlay -->
<div id="cut" onclick="cutTap()">
  <div id="rain"></div>
  <div id="cutFlash"></div>
  <button class="topb" id="cutSkip" onclick="event.stopPropagation();cutSkip()">SKIP ▶▶</button>
  <div class="cutInner">
    <img id="cutImg" class="her" style="height:210px;display:none">
    <div id="cutText"></div>
  </div>
  <div id="cutTap">▼ TAP</div>
</div>

<!-- credits overlay -->
<div id="credits" onclick="endCredits()"><div id="credRoll"></div></div>

<!-- danmaku overlay -->
<div id="dm" onclick="if(event.target.id==='dm')stopDanmaku()">
  <div id="dmEnd"></div>
  <button class="topb" id="dmClose" onclick="stopDanmaku()" data-i="close"></button>
</div>

<!-- omamori modal -->
<div class="modal" id="oma"><div class="card" style="text-align:left">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h2 style="margin:0" data-i="oma"></h2>
    <button class="btn ghost small" style="width:auto;margin:0;padding:6px 14px;color:#fff;border-color:rgba(255,255,255,.4)" onclick="closeOma()" data-i="close"></button>
  </div>
  <p class="lead" style="margin:4px 0" data-i="oma_lead"></p>
  <div class="tabs" id="tabs"></div>
  <div class="tpane" id="tpane"></div>
</div></div>

 concept:{ja:"好きだった人を、<br>1年間あなたを楽しませてくれた<br><b style=\"color:var(--neon)\">「ホスト」</b>だったと思ってみよう。<br>夢みたいに楽しかった。<br>でも、お店はもう閉店。<br>だから――仕方ない。",

 memo1_s:{ja:"🧠 心理学メモ：気持ちに名前をつける",zh:"🧠 心理學小筆記：替心情命名"},
 memo1:{ja:"気持ちを言葉にするだけで、脳の「不安・怒りのアラーム」が少し静まりやすい、という研究があります（感情ラベリング／Liebermanら, 2007）。ぐちゃぐちゃな気持ちも、名前がつくと少しだけ扱いやすくなります。",
        zh:"有研究發現，光是把心情說出來，大腦的「不安・憤怒警報」就比較容易平靜下來（情緒標記／Lieberman 等, 2007）。亂成一團的心情，有了名字就會好處理一點。"},
 next1:{ja:"これが、いまの私",zh:"這就是現在的我"},
 feel_ok:{ja:"ぜんぶ、ちゃんと感じていい気持ち。",zh:"全部，都是可以好好感受的心情。"},
 feel_blame:{ja:"尽くしたのも、好きになったのも、<br>悪いことじゃないよ。",zh:"付出也好，喜歡上他也好，<br>都不是壞事喔。"},
 feel_love:{ja:"まだ好きでも、前には進める。",zh:"就算還喜歡，也能往前走。"},
 c2_t:{ja:"思い出のシャボン玉",zh:"回憶的泡泡"},
 c2_lead:{ja:"1年分の、楽しかった時間。<br>ひとつずつ触れて、星にしていこう。",zh:"一整年的快樂時光。<br>一個一個碰一下，把它們變成星星。"},
 memo2_s:{ja:"🧠 心理学メモ：会いたくなるのは自然なこと",zh:"🧠 心理學小筆記：想見他是很自然的"},
 memo2:{ja:"失恋直後の脳では、依存と同じ「ほしい」の回路が強く働いていることがわかっています（Fisherら, 2010）。会いたくなるのは、あなたが弱いからじゃなくて脳の自然な反応。楽しかった気持ちは否定しなくていいし、まだ好きでも大丈夫です。",
        zh:"研究發現，剛失戀的大腦裡，和成癮相同的「渴望」迴路會強烈運作（Fisher 等, 2010）。想見他不是因為你軟弱，而是大腦的自然反應。快樂的感覺不用否定，還喜歡他也沒關係。"},
 mem_btn:{ja:"楽しかったね",zh:"很開心呢"},
 mem_done:{ja:"ぜんぶ、本物の「楽しい」だった。<br>それは、誰にも取り消せない。<br>だから、持って帰っていい。",zh:"全部，都是真正的「快樂」。<br>那是誰都無法收回的。<br>所以，可以帶回家。"},
 c3_t:{ja:"ひどいレシートを捨てる",zh:"丟掉爛收據"},
 c3_lead:{ja:"あの人がくれた、ひどいレシート。<br>払わされたのは、私の時間と気持ち。<br>1枚ずつ、捨てていこう。",zh:"那個人給的，爛收據。<br>被迫付出的，是我的時間和心意。<br>一張一張，丟掉吧。"},
 rc_cost:{ja:"支払ったもの：",zh:"付出的："},
 rc_hint1:{ja:"タップして裏返す",zh:"點一下翻面"},
 rc_hint2:{ja:"もう一度タップで、くしゃっと捨てる",zh:"再點一下，揉成一團丟掉"},
 rc_done:{ja:"🗑️✨<br>ひどいレシートは、ぜんぶ捨てた。<br>私が払うのは、ここまで。<br>これからの時間は、私のために。",zh:"🗑️✨<br>爛收據，全部丟掉了。<br>我付出的，就到這裡。<br>接下來的時間，留給自己。"},
 memo3_s:{ja:"🧠 心理学メモ：「損した」から抜け出す",zh:"🧠 心理學小筆記：走出「虧了」的感覺"},
 memo3:{ja:"モヤモヤは、言葉にして外に出すだけで少し軽くなります。そして「あんなにガマンしたのに」と思うのは、取り戻せないコストにとらわれる<b>サンクコスト</b>の罠。「私がダメだった」ではなく「私はこういう良さを持っている」と意味づけし直す――これは<b>認知的再評価</b>という、気分を整える代表的な方法です。",
        zh:"心裡卡卡的事，光是說出來就會輕一點。而「明明忍了那麼多」的念頭，是被無法收回的成本綁住的<b>沉沒成本</b>陷阱。不是「我不夠好」，而是「我有這樣的優點」——重新賦予意義，這是調整心情的代表方法<b>認知再評估</b>。"},
 c4_t:{ja:"本当は、イヤだったこと",zh:"其實，討厭的事"},
 c4_lead:{ja:"楽しかった。でも、モヤモヤもあった。<br>当てはまるものを、ぜんぶ選んでいいよ。",zh:"很開心。但也有過心裡卡卡的時候。<br>符合的，全部選起來吧。"},
 own_ph:{ja:"自分で書く（例：既読無視されがち）",zh:"自己寫（例：常常已讀不回）"},
 dis_btn:{ja:"これが、イヤだった",zh:"這些，我很討厭"},
 c4_lead2:{ja:"タップしてみて。<br>イヤだったことは、ぜんぶ「次の人」が叶えてくれる。",zh:"點點看。<br>討厭過的事，「下一個人」都會替你圓滿。"},
 memo4_s:{ja:"🧠 心理学メモ：イヤなところを思い出す効果",zh:"🧠 心理學小筆記：回想討厭之處的效果"},
 memo4:{ja:"相手のイヤなところを思い出すと「好き」の気持ちが弱まりやすい、という実験があります（Langeslag & Sanchez, 2018）。ただ、そのとき気分は少し下がりやすいので、「次はこうなる」という希望とセットにするのがポイントです。",
        zh:"有實驗發現，回想對方討厭的地方，「喜歡」的感覺比較容易變淡（Langeslag & Sanchez, 2018）。不過那時心情也容易變差，所以重點是搭配「下次會這樣」的希望。"},
 wish_done:{ja:"{N}が叶えられなかったことは、<br>ぜんぶ、次の人が叶えてくれる。<br>だから、ここで終わっていい。",zh:"{N}沒能給你的，<br>下一個人都會給你。<br>所以，可以在這裡結束了。"},
 c5_t:{ja:"出さない手紙",zh:"不寄出的信"},
 c5_lead:{ja:"言えなかったこと、ぜんぶ書いていい。<br>この手紙は送られないし、どこにも保存されない。",zh:"說不出口的話，全部寫下來吧。<br>這封信不會寄出，也不會存在任何地方。"},

 memo6_s:{ja:"🧠 心理学メモ：区切りの儀式",zh:"🧠 心理學小筆記：告別的儀式"},
 memo6:{ja:"「ここで終わり」と区切る儀式は、終わりを心で受け入れる助けになると言われています。そして、元恋人のSNSを見続ける人ほど立ち直りが遅い傾向も（Marshall, 2012）。右上の「お守り」→「お片付け」も使ってみてね。",
        zh:"據說「到這裡為止」的告別儀式，能幫助心裡接受結束。另外，一直看前任社群的人，往往比較難走出來（Marshall, 2012）。也試試右上角「護身符」裡的「整理」吧。"},

 memo7_s:{ja:"🧠 心理学メモ：「自分」を取り戻す",zh:"🧠 心理學小筆記：找回「自己」"},
 memo7:{ja:"長い関係が終わると「自分って何だっけ？」とわからなくなりやすく、それがつらさの大きな原因になります（Slotterら, 2010）。好きだったことを思い出すのは回復の近道。そして失恋のあとに「成長できた」と感じる人はとても多いんです（Tashiro & Frazier, 2003）。",
        zh:"長久的關係結束後，容易搞不清「我是誰？」，這是痛苦的一大原因（Slotter 等, 2010）。想起自己喜歡的事是復原的捷徑。而且很多人在失戀後都覺得「自己成長了」（Tashiro & Frazier, 2003）。"},

function chipGroup(el,g,arr,max,onchg){
  el.innerHTML='';
  GROUPS[g].forEach((it,idx)=>{const d=document.createElement('div');d.className='chip';d.dataset.g=g;d.dataset.i=idx;d.textContent=L(it);
    if(arr.includes(idx))d.classList.add('sel');
    d.onclick=()=>{const k=arr.indexOf(idx);if(k>=0){arr.splice(k,1);d.classList.remove('sel')}else if(!max||arr.length<(typeof max==='function'?max():max)){arr.push(idx);d.classList.add('sel')}onchg&&onchg()};
    el.appendChild(d)});
}

function applyLang(){
  document.body.classList.toggle('zh',LANG==='zh');
  document.documentElement.lang=LANG==='zh'?'zh-Hant':'ja';
  document.title=T('title');
  $('langBtn').textContent=LANG==='zh'?'日本語':'中文';

  document.querySelectorAll('[data-ph]').forEach(el=>el.placeholder=T(el.dataset.ph).replace(/<[^>]+>/g,''));
  document.querySelectorAll('.chip[data-g]').forEach(el=>el.textContent=L(GROUPS[el.dataset.g][+el.dataset.i]));
  const g=loadG();
  if(g){$('toGarden').style.display='block';$('toGarden').textContent=T('to_garden',{C:g.log.length})}

  if(CUR===1&&$('feelOut').innerHTML)feelOutRender();

}

function startHold(){
  $('holdArea').style.display='block';$('holdText').innerHTML=T('hold_intro');
  const btn=$('holdBtn'),fill=$('holdFill');btn.style.display='block';$('holdArea').scrollIntoView({behavior:'smooth'});
  const Lt=$('lights');Lt.innerHTML='';for(let i=0;i<5;i++){const l=document.createElement('div');l.className='lt';Lt.appendChild(l)}
  let p=0,t=null,done=false;const DUR=4500;
  const tick=()=>{p=Math.min(1,p+50/DUR);fill.style.width=(p*100)+'%';const k=Math.floor(p*5);
    document.querySelectorAll('.lt').forEach((l,i)=>l.classList.toggle('off',i<k));
    $('holdText').innerHTML=L(HOLD_LINES[Math.min(4,k)]);
    if(p>=1&&!done){done=true;stop();finishHold()}};
  const start=e=>{e.preventDefault();if(done||t)return;t=setInterval(tick,50)};
  const stop=()=>{clearInterval(t);t=null;if(!done){const back=setInterval(()=>{if(t||done){clearInterval(back);return}p=Math.max(0,p-0.02);fill.style.width=(p*100)+'%';if(p<=0)clearInterval(back)},50)}};
  btn.onpointerdown=start;btn.onpointerup=stop;btn.onpointerleave=stop;btn.onpointercancel=stop;btn.oncontextmenu=e=>e.preventDefault();
}
function finishHold(){
  $('holdBtn').disabled=true;$('holdText').innerHTML=T('hold_done');
  $('sky').style.opacity=.55;setTimeout(()=>playCut('b',()=>go(7)),3000);
}

let CUT=null;
function playCut(name,done){
  const c=CUTS[name];CUT={c,i:-1,done,typing:false,timer:null};
  const el=$('cut');el.classList.add('on');el.classList.remove('dawnbg');
  const r=$('rain');r.innerHTML='';r.style.display=c.rain?'block':'none';
  if(c.rain)for(let i=0;i<70;i++){const d=document.createElement('div');d.className='rd';d.style.left=Math.random()*100+'%';d.style.animationDuration=(.5+Math.random()*.6)+'s';d.style.animationDelay=(-Math.random())+'s';r.appendChild(d)}
  cutNext();
}
function cutTap(){if(!CUT)return;if(CUT.typing){CUT.finish();return}cutNext()}
function cutSkip(){if(!CUT)return;const d=CUT.done;clearInterval(CUT.timer);CUT=null;$('cut').classList.remove('on');d&&d()}
function cutNext(){
  CUT.i++;const ln=CUT.c.lines[CUT.i];
  if(!ln){cutSkip();return}
  const el=$('cut'),tx=$('cutText'),im=$('cutImg');
  tx.className=ln.st||'';
  if(ln.bg==='dawn')el.classList.add('dawnbg');
  if(ln.bg==='dawn'||ln.st==='huge')$('rain').style.display='none';
  if(ln.img!=null){im.style.display='block';if(im.dataset.k!==String(ln.img)){im.src=HER[ln.img];im.dataset.k=ln.img;im.style.animation='none';im.offsetHeight;im.style.animation=''}}
  else im.style.display='none';
  if(ln.fx==='flash'){const f=$('cutFlash');f.classList.remove('go');f.offsetHeight;f.classList.add('go')}
  if(ln.fx==='shake'){el.classList.remove('shake');el.offsetHeight;el.classList.add('shake')}
  const full=L(ln.t);tx.style.fontSize='';tx.innerHTML=full;{let fs=parseFloat(getComputedStyle(tx).fontSize);const mw=tx.clientWidth;while(tx.scrollWidth>mw&&fs>13){fs-=1;tx.style.fontSize=fs+'px'}}tx.innerHTML='';
  const toks=full.split(/(<br>|<b>|<\/b>)/).flatMap(s=>/^<\/?b>$|^<br>$/.test(s)?[s]:[...s]);
  let k=0;CUT.typing=true;clearInterval(CUT.timer);
  const show=()=>{tx.innerHTML=toks.slice(0,k).join('')};
  CUT.finish=()=>{clearInterval(CUT.timer);k=toks.length;show();CUT.typing=false};
  CUT.timer=setInterval(()=>{k++;show();if(k>=toks.length)CUT.finish()},ln.st==='huge'?110:55);
}

  S.self.forEach(i=>p.push({k:'🎈',lab:{ja:'わたしの好きなこと',zh:'我喜歡的事'},t:L(SELF[i]),pow:22}));

let dmTimers=[];
function playDanmaku(){
  let lines=loadF();if(!lines.length)lines=FRIEND_SUG.map(L);
  const dm=$('dm');dm.querySelectorAll('.dmi').forEach(x=>x.remove());$('dmEnd').style.opacity=0;$('dmEnd').innerHTML=T('friend_end');
  dm.classList.add('on');
  const colors=['#fff','#ffd77a','#ffb3d6','#c9b0ff','#ffe3ef'];
  const lanes=10;let n=0,lastLane=-1;
  const spawn=()=>{
    const d=document.createElement('div');d.className='dmi';d.innerHTML=lines[n%lines.length];n++;
    let lane;do{lane=Math.floor(Math.random()*lanes)}while(lane===lastLane);lastLane=lane;
    d.style.top=(8+lane*8)+'%';
    const fs=16+Math.floor(Math.random()*10);d.style.fontSize=fs+'px';
    const col=colors[Math.floor(Math.random()*colors.length)];d.style.color=col;d.style.textShadow=`0 0 10px ${col==='#fff'?'#ff5fa8':col}, 0 2px 4px rgba(0,0,0,.4)`;
    d.style.animationDuration=(6+Math.random()*4)+'s';
    dm.appendChild(d);setTimeout(()=>d.remove(),11000);
  };
  spawn();
  const iv=setInterval(spawn,520);dmTimers.push(iv);
  dmTimers.push(setTimeout(()=>{clearInterval(iv)},16000));
  dmTimers.push(setTimeout(()=>{$('dmEnd').style.opacity=1},17500));
}

function graphSVG(g){
  const pts=[g.m0,...g.log.map(l=>l.mood)];
  const W=300,H=110,P=14,n=Math.max(pts.length,2);
  const x=i=>P+i*(W-2*P)/(Math.max(n-1,1)),y=v=>P+(v/10)*(H-2*P);
  const path=pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${(H-y(v)).toFixed(1)}`).join(' ');
  const dots=pts.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${(H-y(v)).toFixed(1)}" r="3.5" fill="#ff7fa8"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:rgba(255,255,255,.5);border-radius:12px">
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#d9b8c8"/>
    <text x="${P}" y="${P-3}" font-size="9" fill="#a0507a">10</text><text x="${P}" y="${H-3}" font-size="9" fill="#a0507a">0</text>
    <path d="${path}" fill="none" stroke="#ff7fa8" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg>
    <div class="mlab" style="margin-top:4px"><span>Start</span><span>${LANG==='zh'?'今天':'今日'}</span></div>`;
}
